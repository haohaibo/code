<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="s1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8CC79E"/><stop offset="1" stop-color="#2F7A48"/></linearGradient>
    <linearGradient id="s2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F5C77E"/><stop offset="1" stop-color="#D89132"/></linearGradient>
    <linearGradient id="s3" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F49AA3"/><stop offset="1" stop-color="#B4232C"/></linearGradient>
    <linearGradient id="s4" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#A99BD6"/><stop offset="1" stop-color="#6B5AA8"/></linearGradient>
    <linearGradient id="g-open" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#4A86C5"/><stop offset="1" stop-color="#1F5C99"/></linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-opacity="0.2"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4232C"/>
    </marker>
  </defs>

  <g filter="url(#soft2)">
    <rect x="100" y="8" width="770" height="34" rx="17" fill="url(#g-open)"/>
    <text x="485" y="31" text-anchor="middle" font-family="Source Han Sans SC, PingFang SC, sans-serif"
          font-size="13.5" font-weight="700" fill="#fff">开场设疑（3 分钟）：发行条件全部满足，为什么没有上市？</text>
  </g>

  <g font-family="Source Han Sans SC, PingFang SC, sans-serif" font-size="13" font-weight="700">
    <rect x="10" y="62"  width="70" height="80" rx="8" fill="#FCEEEF" stroke="#B4232C"/>
    <text x="45" y="94"  text-anchor="middle" fill="#B4232C">教学</text>
    <text x="45" y="116" text-anchor="middle" fill="#B4232C">环节</text>

    <rect x="10" y="230" width="70" height="60" rx="8" fill="#EEF4FB" stroke="#1F5C99"/>
    <text x="45" y="254" text-anchor="middle" fill="#1F5C99">专业</text>
    <text x="45" y="276" text-anchor="middle" fill="#1F5C99">主线</text>

    <rect x="10" y="360" width="70" height="60" rx="8" fill="#EEF6EF" stroke="#2F7A48"/>
    <text x="45" y="384" text-anchor="middle" fill="#2F7A48">价值</text>
    <text x="45" y="406" text-anchor="middle" fill="#2F7A48">主线</text>
  </g>

  <g filter="url(#soft2)" font-family="Source Han Sans SC, PingFang SC, sans-serif" text-anchor="middle" fill="#fff">
    <rect x="104" y="52" width="176" height="100" rx="22" fill="url(#s1)"/>
    <text x="192" y="88" font-size="18" font-weight="700">该上哪里</text>
    <text x="192" y="112" font-size="12" opacity=".95">议题一 · 22 分钟</text>
    <text x="192" y="134" font-size="12" opacity=".95">回答方向问题</text>

    <rect x="299" y="52" width="176" height="100" rx="22" fill="url(#s2)"/>
    <text x="387" y="88" font-size="18" font-weight="700">能不能上</text>
    <text x="387" y="112" font-size="12" opacity=".95">议题二 · 32 分钟</text>
    <text x="387" y="134" font-size="12" opacity=".95">回答资格问题</text>

    <rect x="494" y="52" width="176" height="100" rx="22" fill="url(#s3)"/>
    <text x="582" y="88" font-size="18" font-weight="700">谁来判断</text>
    <text x="582" y="112" font-size="12" opacity=".95">议题三 · 29 分钟</text>
    <text x="582" y="134" font-size="12" opacity=".95">回答主体问题</text>

    <rect x="689" y="52" width="176" height="100" rx="22" fill="url(#s4)"/>
    <text x="777" y="88" font-size="18" font-weight="700">课后延伸</text>
    <text x="777" y="112" font-size="12" opacity=".95">线上 · 10 分钟</text>
    <text x="777" y="134" font-size="12" opacity=".95">回答尺度问题</text>
  </g>

  <g stroke="#B4232C" stroke-width="2" fill="none">
    <path d="M281,102 L297,102" marker-end="url(#arr2)"/>
    <path d="M476,102 L492,102" marker-end="url(#arr2)"/>
    <path d="M671,102 L687,102" marker-end="url(#arr2)"/>
  </g>

  <rect x="90" y="225" width="800" height="70" rx="35" fill="#EEF4FB" stroke="#1F5C99" stroke-width="1.5"/>
  <g font-family="Source Han Sans SC, PingFang SC, sans-serif" text-anchor="middle" fill="#1F5C99" font-size="12" font-weight="600">
    <text x="192" y="256">五大板块与五套标准</text>
    <text x="192" y="276" font-size="10.5" font-weight="500" fill="#375A82">境外上市备案管理制度</text>

    <text x="387" y="256">财务门槛与三道防线</text>
    <text x="387" y="276" font-size="10.5" font-weight="500" fill="#375A82">事前审核 · 事中暂缓 · 事后追责</text>

    <text x="582" y="256">审批制 → 核准制 → 注册制</text>
    <text x="582" y="276" font-size="10.5" font-weight="500" fill="#375A82">交易所审核 · 证监会注册</text>

    <text x="777" y="256">定价询价与破发机制</text>
    <text x="777" y="276" font-size="10.5" font-weight="500" fill="#375A82">投资者适当性管理</text>
  </g>

  <g stroke="#1F5C99" stroke-width="1.4" fill="none" stroke-dasharray="4,3">
    <path d="M192,152 L192,225"/>
    <path d="M387,152 L387,225"/>
    <path d="M582,152 L582,225"/>
    <path d="M777,152 L777,225"/>
  </g>

  <rect x="90" y="355" width="800" height="70" rx="35" fill="#EEF6EF" stroke="#2F7A48" stroke-width="1.5"/>
  <g font-family="Source Han Sans SC, PingFang SC, sans-serif" text-anchor="middle" fill="#2F7A48" font-size="12.5" font-weight="600">
    <text x="192" y="382">家国情怀</text>
    <text x="192" y="402" font-size="10.5" font-weight="500" fill="#355F42">资本市场服务国家战略</text>

    <text x="387" y="382">诚信法治</text>
    <text x="387" y="402" font-size="10.5" font-weight="500" fill="#355F42">以信息披露为核心</text>

    <text x="582" y="382">制度自信</text>
    <text x="582" y="402" font-size="10.5" font-weight="500" fill="#355F42">有效市场与有为政府</text>

    <text x="777" y="382">金融为民</text>
    <text x="777" y="402" font-size="10.5" font-weight="500" fill="#355F42">投资者保护是执业底线</text>
  </g>

  <g stroke="#2F7A48" stroke-width="1.4" fill="none" stroke-dasharray="4,3">
    <path d="M192,295 L192,355"/>
    <path d="M387,295 L387,355"/>
    <path d="M582,295 L582,355"/>
    <path d="M777,295 L777,355"/>
  </g>

  <g>
    <circle cx="90"  cy="260" r="7" fill="#1F5C99"/>
    <circle cx="890" cy="260" r="7" fill="#1F5C99"/>
    <circle cx="90"  cy="390" r="7" fill="#2F7A48"/>
    <circle cx="890" cy="390" r="7" fill="#2F7A48"/>
  </g>

  <g font-family="Source Han Sans SC, PingFang SC, sans-serif" text-anchor="middle" font-size="13" font-weight="700">
    <rect x="140" y="447" width="690" height="34" rx="17" fill="#FBF3F4" stroke="#B4232C"/>
    <text x="485" y="470" fill="#7A1720">总纲：从“能不能上”到“该不该上”——中国资本市场的价值坐标</text>
  </g>
</svg>
